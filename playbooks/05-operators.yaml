---
# Phase 5: Operators - Operator installation
# This phase installs and configures OpenShift operators
#
# Performs:
# - Disable default catalog sources (disconnected mode)
# - Auto-discover and deploy foundation plugins (type: foundation)
#   Storage plugins (LVMS/ODF) run here, BEFORE core operators,
#   so that Quay can rely on the storage backend being present.
# - Install general operators from defaults/operators.yaml
#
# Usage:
#   ansible-playbook playbooks/05-operators.yaml -e workingDir=/home/cloud-user [-e disconnected=false]

- name: Phase 5 - Operator installation
  hosts: localhost
  gather_facts: false
  environment:
    PATH: "{{ workingDir }}/bin:{{ lookup('env', 'PATH') }}"
  tasks:
    - name: Load common variables
      ansible.builtin.include_tasks:
        file: common/load-vars.yaml
        apply:
          tags: always
      tags: always

    - name: Display operator installation mode
      ansible.builtin.debug:
        msg: "Installing operators in {{ 'disconnected' if (disconnected | default(true)) else 'connected' }} mode"
      tags: always

    - name: Validate enabled plugin requirements
      ansible.builtin.include_tasks:
        file: tasks/validate_enabled_plugins.yaml
        apply:
          tags:
            - foundation-plugins
            - operators
      tags:
        - foundation-plugins
        - operators

    block:
      - name: Wait for the async task mirror_registry_post (operators and additional images)
        when: disconnected | default(true) | bool
        ansible.builtin.include_tasks:
          file: tasks/background_task_wait.yaml
          apply:
            tags:
              - foundation-plugins
              - operators
        tags:
          - foundation-plugins
          - operators
        vars:
          task_id: mirror_post
    rescue:
      - name: Read oc-mirror log tail
        ansible.builtin.command:
          argv:
            - tail
            - -n
            - "10"
            - "{{ _oc_mirror_quay_log }}"
        register: _oc_mirror_quay_tail
        changed_when: false
        failed_when: false
      - name: oc-mirror failed
        ansible.builtin.fail:
          msg: |-
            oc-mirror to internal Quay failed after {{ r_oc_mirror_post.attempts }} attempts.
            {{ _oc_mirror_quay_tail.stdout | default('Unable to read oc-mirror log tail.') }}
            Full log: {{ _oc_mirror_quay_log }}


